<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Club update · Stage</title><link rel="stylesheet" href="everyday.css"></head>
<body><div class="win">
<div class="title"><span class="lights"><span></span><span></span><span></span></span><span class="name">Club update</span>
  <button class="tb"><span class="i">▤</span>View</button><select aria-label="Zoom"><option>Fit</option></select>
  <button class="tb" data-eval-target="add-slide"><span class="i">＋</span>Add Slide</button><span class="grow"></span>
  <button class="tb" data-eval-target="play"><span class="i">▶</span>Play</button>
  <button class="tb"><span class="i">▦</span>Table</button><button class="tb"><span class="i">▮</span>Chart</button><button class="tb"><span class="i">T</span>Text</button><button class="tb"><span class="i">◆</span>Shape</button><button class="tb"><span class="i">▣</span>Media</button>
  <span class="grow"></span>
  <button class="tb"><span class="i">👥</span>Collaborate</button><button class="tb"><span class="i">🖌</span>Format</button><button class="tb" data-eval-target="animate"><span class="i">◇</span>Animate</button><button class="tb"><span class="i">▭</span>Document</button>
</div>
<div class="body">
  <aside class="side" style="width:170px">
    <button class="box on" style="width:100%;height:80px;margin-bottom:8px" aria-label="Slide 1">1 · Welcome</button>
    <button class="box" style="width:100%;height:80px;margin-bottom:8px" aria-label="Slide 2">2 · This season</button>
    <button class="box" style="width:100%;height:80px;margin-bottom:8px" aria-label="Slide 3" data-eval-target="slide-3">3 · Money</button>
    <button class="box" style="width:100%;height:80px;margin-bottom:8px" aria-label="Slide 4">4 · Next year</button>
    <button class="box" style="width:100%;height:80px" aria-label="Slide 5">5 · Thanks</button>
  </aside>
  <main class="main" style="background:#f5f5f7;display:flex;align-items:center;justify-content:center">
    <div class="canvas" style="width:720px;height:405px;background:#fff;flex-direction:column">
      <div style="font-size:34px;font-weight:700">Riverside Walking Club</div>
      <div class="muted" style="font-size:18px;margin-top:10px">Autumn update, October 2026</div>
    </div>
  </main>
</div>
</div></body></html>
