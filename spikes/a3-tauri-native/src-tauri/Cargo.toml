[package]
name = "a3-spike"
version = "0.0.1"
edition = "2021"
publish = false
description = "M0 spike (a3): Tauri web pages inside panels created natively, non activating from the start. Throwaway."

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "=2.4.0"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3.2"
block2 = "0.6"

[profile.release]
debug = false
