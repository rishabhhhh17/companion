<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Panel Spike card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-label="card">
  <main id="card">
    <div class="row"><b>Type here</b> <span class="small">(Esc hides this and gives typing back)</span></div>
    <input id="cardbox" type="text" autocomplete="off" spellcheck="false" />
    <div class="row small">Card has keyboard: <b id="cardkey">?</b></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
