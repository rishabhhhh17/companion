<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Write to us</title>
<style>body{font:16px -apple-system,sans-serif;max-width:420px;margin:60px auto;padding:0 20px}label{display:block;margin:12px 0 4px}input,textarea{padding:8px;width:90%}button{margin-top:12px;padding:8px 14px}</style></head>
<body>
  <h1>Write to us</h1>
  <p>Questions about an order? We answer within a day.</p>
  <form method="post" action="/api/contact">
    <label for="name">Your name</label>
    <input id="name" name="name">
    <label for="message">Your message</label>
    <textarea id="message" name="message" rows="4"></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
