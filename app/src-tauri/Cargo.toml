[package]
name = "companion-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Squibby desktop shell: native non activating panels with a web page inside (T01)."

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
serde_json = "1"   # build.rs hands protocol/names.json to the compiler (src/names.rs)

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.6"
base64 = "0.22"
whisper-rs = { version = "=0.16.0", features = ["metal"] }
cpal = "0.18"
sha2 = "0.11"
libc = "0.2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3.2"
block2 = "0.6"
objc2-screen-capture-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-vision = "0.3.2"
objc2-core-foundation = "0.3"
objc2-av-foundation = "0.3.2"
objc2-avf-audio = "0.3.2"
security-framework = "3"

[profile.release]
strip = true
debug = false
