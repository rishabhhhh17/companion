<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Squibby pointer</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
.drop{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:0 50% 50% 50%;background:radial-gradient(circle at 62% 62%,var(--deep,#1676C8) 0 30%,var(--mid,#59D2FF) 72%,#c9f1ff 100%);box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(0,40,80,.35);transform:rotate(calc(var(--a,0deg) + 45deg));transition:transform 120ms cubic-bezier(.23,1,.32,1);will-change:transform}
.drop::after{content:"";position:absolute;left:26%;top:44%;width:2.5px;height:4px;border-radius:50%;background:#fff;opacity:.9;transform:rotate(-45deg)}
@media (prefers-reduced-motion:reduce){.drop{transition:none;transform:none}}
:root[data-less-motion] .drop{transition:none;transform:none}</style></head>
<body><div class="drop" id="d" aria-hidden="true"></div><script type="module" src="/src/follow.ts"></script></body></html>
