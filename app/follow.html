<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Squibby pointer</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
.drop{position:absolute;left:50%;top:50%;width:20px;height:17px;margin:-8.5px 0 0 -10px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:radial-gradient(circle at 34% 28%,#fff 0 8%,var(--mid,#59D2FF) 46%,var(--deep,#1676C8));box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 -2px 3px rgba(0,30,80,.3),inset 0 0 0 .5px rgba(0,40,80,.35);transform:rotate(calc(var(--a,0deg) * .25));transition:transform 140ms cubic-bezier(.23,1,.32,1);will-change:transform}
.drop i{position:absolute;top:40%;width:4.5px;height:5.5px;border-radius:50%;background:radial-gradient(circle at 55% 58%,#0d2240 0 42%,#fff 46%)}
.drop i:first-child{left:26%}.drop i:last-child{right:26%}
@media (prefers-reduced-motion:reduce){.drop{transition:none;transform:none}}
:root[data-less-motion] .drop{transition:none;transform:none}</style></head>
<body><div class="drop" id="d" aria-hidden="true"><i></i><i></i></div><script type="module" src="/src/follow.ts"></script></body></html>
