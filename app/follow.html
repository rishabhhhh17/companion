<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Squibby drop</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
.drop{position:absolute;left:50%;top:50%;width:18px;height:22px;margin:-11px 0 0 -9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 38% 32%,#fff 0 12%,var(--mid,#59D2FF) 46%,var(--deep,#1676C8));box-shadow:0 2px 6px rgba(0,0,0,.28),inset 0 -2px 3px rgba(0,0,0,.18);transform:rotate(var(--a,0deg)) scale(var(--sx,1),var(--sy,1));transition:transform 90ms linear;will-change:transform}
@media (prefers-reduced-motion:reduce){.drop{transition:none;transform:none}}
:root[data-less-motion] .drop{transition:none;transform:none}</style></head>
<body><div class="drop" id="d" aria-hidden="true"></div><script type="module" src="/src/follow.ts"></script></body></html>
