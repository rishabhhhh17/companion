<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Squibby pointer</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
.ring{position:absolute;left:0;top:0;width:44px;height:44px;display:block}
.say{position:absolute;left:44px;top:50%;transform:translateY(-50%);max-width:210px;white-space:nowrap;padding:6px 12px;border-radius:999px;background:#141416;color:#fff;font:600 12.5px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;transition:opacity 160ms cubic-bezier(.23,1,.32,1)}
html[data-saying] .say{opacity:1}
@media (prefers-reduced-motion:reduce){.say{transition:none}}</style></head>
<body><canvas class="ring" id="d" width="132" height="132" aria-hidden="true"></canvas><div class="say" id="say" role="status" aria-live="polite"></div><script type="module" src="/src/follow.ts"></script></body></html>
